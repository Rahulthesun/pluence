{% include 'base/setup.html' %}

<style>
  body , html {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background-color: #ffffff;
  }

  ::-webkit-scrollbar {
  display: none;
  }

  #top-pluence {
    font-family: "Poppins";
    font-style: normal;
    font-weight: 800;
    font-size: 40px;
    line-height: 50px;
    letter-spacing: -0.06em;
  }

  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: #fff;
  }
  .top-nav a {
    text-decoration: none;
    color: #000;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.08em;
    margin: 0 30px;
  }
  .top-nav .top_signup {
    background-color: #000;
    color: #fff;
    padding: 10px 40px;
    border-radius: 25px;
    font-weight: 600;
  }
  .main-content {
    display: flex;
    flex-direction: row;
    min-height: 90vh;
    height: auto;
    justify-content: space-between;
    align-items: center;
    padding: 0px 70px;
    padding-top: 0px;
    padding-bottom: 0px;
  }
  .main-text {
    max-width: 60%;


  }
  .main-text h1 {
    font-size: 5vw;
    font-weight: 600;
    line-height: 80px;
    margin: 0;
    margin-bottom: 0px;
  }
  .main-text .signup-now {
    background-color: #000;
    color: #fff;
    padding: 15px 50px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 2vw;
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    

  }

  .main-text .signup-now:hover {
    background-color: white;
    border: 4px solid black;
    color: black;
  }

  .main img {
    width: 60%;
  }

  .main-image img {
    max-width: 450px;
    width: 100%;

  }
  .bottom-nav {
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    width: 100%;
    height: auto;
  }

  .bottom-nav a {
    text-decoration: none;
    color: white;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.08em;
    margin: 0 15px;

  }

  #bottom-pluence {
    font-family: "Poppins";
    font-style: normal;
    font-weight: 800;
    font-size: 32px;
    line-height: 48px;
    letter-spacing: -0.08em;
    color: white;
    margin: 0 20px;
  }

  /* CSS BATCH 2 */

  .main-text h1 {
    line-height: 0.7;
  }

  /* CSS BATCH 3 */

  .main-text h1 {
    line-height: 1.2;
  }

  #footer {
    width: 100%;
    height: auto;
    background: rgba(4, 3, 3, 0.88);
    text-align: center;
    padding: 10px 0px;
    padding-bottom: 20px;
    margin-bottom: 0px;

    min-height: 10vh;
    display: flex;
    flex-direction: column;
    margin-top: auto;
  }
</style>

<body>
  {% block content %} {% endblock content %}
</body>
