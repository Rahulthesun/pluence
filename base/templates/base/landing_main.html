{% include 'base/setup.html' %}

<style>
  body {
    margin: 0;

    font-family: "Poppins", sans-serif;

    font-weight: 800;
    font-size: 40px;
    line-height: 50px;
    letter-spacing: -0.06em;
  }

  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    background-color: #fff;
  }
  .top-nav a {
    text-decoration: none;
    color: #000;
    font-weight: 600;

    letter-spacing: -0.08em;

  }

    justify-content: space-between;

    padding: 70px;

  .main-text {
    max-width: 55%;

    font-weight: 600;
    line-height: 80px;
    margin: 0;
    margin-bottom: 0px;
  }

    color: #fff;
    padding: 15px 50px;
    border-radius: 30px;

    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
  }

  .main-text .signup-now:hover {
    background-color: white;

  }

    max-width: 480px;

  }

    font-family: "Poppins";
    font-style: normal;

    color: white;
    margin: 0 20px;

  .main-text h1 {

  }

  /* CSS BATCH 3 */

  .main-text h1 {
    line-height: 1.2;
  }

    margin-top: 50px;

    background: rgba(4, 3, 3, 0.88);

    padding: 10px 0px;
    padding-bottom: 20px;
    margin-bottom: 0px;
    border: 2px solid red;
