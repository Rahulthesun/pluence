{% extends 'base/main.html' %}

{% block content %}

<section id="form">
    <form method="post" action="" enctype="multipart/form-data">
        <h1>Account Image</h1>
        {% csrf_token %}

        {% for error in form.non_field_errors %}
            <p><span id="error">{{error}}</span></p>
        {% endfor %}
        
        {% for field in form %}
        <p>{{field.label_tag}} {% if field.field.required %}<span id="required">*</span>{% endif %}</p>

            {{ field }} 
        {% endfor %}
        
        <button type="submit">Integrate</button>
    </form>
</section>


{% endblock %}
