{% extends 'base/main.html' %}


{% block content %}
<section id="form">
    <form method="post" action="">
        <h1>Profile </h1>
        {% csrf_token %}

        {% for error in form.non_field_errors %}
            <p><span id="error">Enter a Valid Email or Password</span></p>
        {% endfor %}

        {% for field in form %}
            <p>{{field.label_tag}}</p>
            {{field}}
        {% endfor %}
 
        <button type="submit">Update Profile</button>
    </form>
</section>

{% endblock %}
